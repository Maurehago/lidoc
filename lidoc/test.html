    } else {
        // Template funktion
        const rowTemplate = function (obj) {
            let attr = "";
            let nameAttr = "";
            if ((obj.id + "").endsWith("0")) {
                attr = " border-t";
                nameAttr = " color-green";
            }
            return `<tr data-id="${obj.id}"${attr}>
                <th>${obj.id}</th>
                <td${nameAttr}>${obj.name}</td>
                <td>${obj.info}</td>
                <td>${formatDate(obj.test, "HH:MM:SS.sss")}</td>
            </tr>`;
        }
        console.timeLog("tabelle", "erstellen");

        let htmlString = "<tr pos-sticky pos-t-l color-p><th>ID</th><th>Name</th><th>Info</th><th>Test</th></tr>";
        // Alle in der Liste durchgehen
        list.forEach((obj) => {
            htmlString += rowTemplate(obj);
        }, "name");
        console.timeLog("tabelle", "HTML lesen");
        newTableElm.insertAdjacentHTML("afterbegin", htmlString);
        console.timeLog("tabelle", "anzeigen");
    }
