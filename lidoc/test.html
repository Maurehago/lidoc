<script type="module">
    //@ts-check
    import { GridList, GridView, GSID, lists, FormView, formatNumber, maskString } from "./gridlist.js";
    import { isDate, getWeek, getDateDiff, formatDate, formatWeek } from "./infodate.js";
    import { onInputNumber } from "./infoform.js";
    globalThis.isDate = isDate;
    globalThis.getWeek = getWeek;
    globalThis.getDateDiff = getDateDiff;
    globalThis.formatNumber = formatNumber;
    globalThis.maskString = maskString;
    globalThis.formatDate = formatDate;
    globalThis.formatWeek = formatWeek;

    // Anzahl der Zeilen
    const countRows = 10000;

    console.time("erstellen");
    /** @type {GridList} */
    //const list = new GridList("test", ["id number", "name", "info"], "GSID");
    const list = new GridList("test", ["id number", "name", "info", "test"], "id");
    list.setColDataFormat("test", {date: "date"});

    for (let i = 0; i < countRows; i++) {
        list.setObject({ id: i, name: "Name " + i, info: "Info " + i });
    }
    console.timeLog("erstellen", countRows + " Zeilen einfügen");

    // filtern
    //list.filter((obj) => {
    //    if (obj.name.indexOf("8") > -1) {
    //        return false;
    //    }
    //    return true;
    //}, null, "name");

    // sortieren
    list.sortRows(["id DESC"], "name");
    console.timeLog("erstellen", countRows + " sortieren");


    // Tabelle erstellen
    const newTableElm = document.createElement("table");
    document.getElementById("table")?.appendChild(newTableElm);
    newTableElm.setAttribute("table-stripes", "");
    newTableElm.setAttribute("w-50", "");
    newTableElm.dataset.current = "-1";

    //const newTableElm = document.createElement("div");
    //document.body.appendChild(newTableElm);

    console.time("tabelle");

    let withTableObj = false;
    if (withTableObj) {
        const newTable = new GridView(list);
        //newTable.rowTag = "f-row";
        newTable.rowFunc = (row, colAttr) => {
            if ((row.id + "").endsWith("0")) {
                colAttr.name = "color-green";
                return "border-t";
            }
            return "";
        }
        newTable.setCols(["id th text-c", "name", "info"]);

        console.timeLog("tabelle", "erstellen");
        const html = newTable.getHtml("name");
        console.timeLog("tabelle", "HTML lesen");
        newTableElm.insertAdjacentHTML("afterbegin", html);
        console.timeLog("tabelle", "anzeigen");
    } else {
        // Template funktion
        const rowTemplate = function(obj) {
            let attr = "";
            let nameAttr = "";
            if ((obj.id + "").endsWith("0")) {
                attr = " border-t";
                nameAttr = " color-green";
            }
            return `<tr data-id="${obj.id}"${attr}>
                <th>${obj.id}</th>
                <td${nameAttr}>${obj.name}</td>
                <td>${obj.info}</td>
                <td>${obj.test}</td>
            </tr>`;
        }
        console.timeLog("tabelle", "erstellen");

        let htmlString = "<tr pos-sticky pos-t-l color-p><th>ID</th><th>Name</th><th>Info</th><th>Test</th></tr>";
        // Alle in der Liste durchgehen
        list.forEach((obj) => {
            htmlString += rowTemplate(obj);
        }, "name");
        console.timeLog("tabelle", "HTML lesen");
        newTableElm.insertAdjacentHTML("afterbegin", htmlString);
        console.timeLog("tabelle", "anzeigen");
    }

    const testList = new GridList("test2");
    testList.parse(list.stringify());

    // console.timeEnd("tabelle erstellen");
    console.log("Lists:", lists);


    // Formular
    // Format ID Readonly
    //list.setColDataFormat("id", {password: true});

    const formTemplate = function () {
        return 
    }

    const form = new FormView(list);
    form.setCols(["id ID", "name Name", "info Info", "test"]);
    let formHTML = form.getHTML(9990);
    let formColumn = document.getElementById("form");
    if (formColumn instanceof HTMLElement) {
        formColumn.innerHTML = formHTML;
    }

    // EreignissHandler
    const idElm = document.getElementById("i_test_id");

</script>
